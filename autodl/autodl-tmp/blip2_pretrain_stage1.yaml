datasets:
  coco_caption:
    vis_processor:
      train:
        name: blip2_image_train
        image_size: 364
      eval:
        name: blip_image_eval
        image_size: 364
    text_processor:
      train:
        name: blip_caption
      eval:
        name: blip_caption

model:
  arch: blip2_pretrain
  model_type: pretrain_flant5xl


run:
  task: pretrain_blip2
  seed: 42
  distributed: false
  world_size: 1
  batch_size_train: 4
  batch_size_eval: 4
  num_workers: 4
  max_steps: 5000
  accum_grad_iters: 128
  clip_grad_norm: 5.0
  amp: true
  loss_names: ["itm", "itc", "itg"]
  loss_weights: [1.0, 1.0, 1.0]
  validation_steps: 500
  output_dir: "output/BLIP2/Pretrain_stage1"

optimizer:
  name: adamw
  lr: 1e-4
  weight_decay: 0.05
  betas: [0.9, 0.98]

scheduler:
  warmup_steps: 2000
  lr_sched: cosine




